name: Windows build

# Builds Snifix for Windows, runs the proxy self-test on a real Windows machine,
# makes the installer and attaches it to a release.
on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the installer to (empty: just build)"
        required: false
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Version
        shell: pwsh
        run: |
          [xml]$p = Get-Content windows/Snifix.Windows/Snifix.Windows.csproj
          $v = @($p.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          "SNIFIX_VERSION=$v" >> $env:GITHUB_ENV

      - name: Restore (exact versions from packages.lock.json)
        run: dotnet restore windows/Snifix.Windows -r win-x64 --locked-mode

      - name: Publish
        run: >
          dotnet publish windows/Snifix.Windows -c Release -r win-x64 --self-contained true --no-restore
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o dist/win

      - name: Self-test (real requests through the proxy)
        shell: pwsh
        run: |
          $p = Start-Process dist/win/Snifix.exe -ArgumentList "--selftest" -NoNewWindow -Wait -PassThru -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Installer and zip
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer/snifix.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path dist/win/Snifix.exe -DestinationPath "dist/Snifix-$env:SNIFIX_VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Snifix-windows
          path: |
            dist/Snifix-*-Setup.exe
            dist/Snifix-*-windows-x64.zip

      - name: Attach to release
        if: github.event_name == 'release' || github.event.inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment, not pasted into the script
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          gh release upload $tag (Get-ChildItem dist/Snifix-*-Setup.exe).FullName (Get-ChildItem dist/Snifix-*-windows-x64.zip).FullName --clobber
